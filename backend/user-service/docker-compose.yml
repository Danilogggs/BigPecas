services:
  mysql-users:
    image: mysql:8.0
    container_name: mysql-users
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: user_service_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql

volumes:
  mysql_users_data:
