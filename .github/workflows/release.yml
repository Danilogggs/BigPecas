name: Release Azure por branch
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && vars.CD_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  dev:
    if: github.ref == 'refs/heads/develop'
    needs: validate
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
    secrets: inherit
  test:
    if: github.ref == 'refs/heads/develop'
    needs: dev
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: test
    secrets: inherit
  promote:
    name: Abrir PR para producao
    if: github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Criar ou reutilizar PR develop para main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head develop --state open --json number --jq '.[0].number')"
          if [ -n "$PR_NUMBER" ]; then
            echo "PR #$PR_NUMBER ja esta aberta para producao."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head develop \
              --title "Promover develop para producao" \
              --body "CI e deployments de dev e test concluidos com sucesso. Revisar as alteracoes e realizar o merge manual para iniciar a aprovacao de producao."
          fi
  prod:
    if: github.ref == 'refs/heads/main'
    needs: validate
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
    secrets: inherit
