name: Release Azure por branch
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && vars.CD_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  dev:
    if: github.ref == 'refs/heads/develop'
    needs: validate
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
    secrets: inherit
  test:
    if: github.ref == 'refs/heads/develop'
    needs: dev
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: test
    secrets: inherit
  prod:
    if: github.ref == 'refs/heads/main'
    needs: validate
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
    secrets: inherit
