name: Deploy one Azure environment
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: vars.CD_ENABLED == 'true' && ((github.ref == 'refs/heads/develop' && (inputs.environment == 'dev' || inputs.environment == 'test')) || (github.ref == 'refs/heads/main' && inputs.environment == 'prod'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.platform.outputs.frontendUrl }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      AZURE_RESOURCE_GROUP: rg-bigpecas-${{ inputs.environment }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      TEST_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
      PROD_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      SHIPPING_TOKEN: ${{ secrets.MELHOR_ENVIO_ACCESS_TOKEN }}
      SHIPPING_URL: ${{ vars.MELHOR_ENVIO_URL }}
      MIN_REPLICAS: ${{ vars.MIN_REPLICAS || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verificar configuracao e isolamento antes de criar recursos
        run: node scripts/devops/config.mjs
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az bicep install --version v0.47.16
      - name: Planejar infraestrutura
        run: az deployment group what-if --resource-group "$AZURE_RESOURCE_GROUP" --template-file infra/azure/platform.bicep --parameters environment="$DEPLOY_ENVIRONMENT" --result-format ResourceIdOnly
      - name: Provisionar plataforma
        id: platform
        shell: bash
        run: |
          az deployment group create --name "platform-${GITHUB_RUN_ID}" --resource-group "$AZURE_RESOURCE_GROUP" --template-file infra/azure/platform.bicep --parameters environment="$DEPLOY_ENVIRONMENT" --query properties.outputs -o json > "$RUNNER_TEMP/platform.json"
          jq -r 'to_entries[] | "\(.key)=\(.value.value)"' "$RUNNER_TEMP/platform.json" >> "$GITHUB_OUTPUT"
      - name: Login no registro privado
        env:
          REGISTRY_NAME: ${{ steps.platform.outputs.registryName }}
        run: az acr login --name "$REGISTRY_NAME"
      - uses: docker/setup-buildx-action@v3
      - name: Build e push backend
        id: api
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.platform.outputs.registryServer }}/backend:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build e push frontend
        id: web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.platform.outputs.registryServer }}/frontend:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            VITE_API_URL=${{ steps.platform.outputs.backendUrl }}
            VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Parametros seguros fora do repositorio
        env:
          BACKEND_IMAGE: ${{ steps.platform.outputs.registryServer }}/backend@${{ steps.api.outputs.digest }}
          FRONTEND_IMAGE: ${{ steps.platform.outputs.registryServer }}/frontend@${{ steps.web.outputs.digest }}
        run: node scripts/devops/config.mjs --write
      - name: Planejar aplicacoes
        run: az deployment group what-if --resource-group "$AZURE_RESOURCE_GROUP" --template-file infra/azure/apps.bicep --parameters "@$RUNNER_TEMP/bigpecas.parameters.json" --result-format ResourceIdOnly
      - name: Deploy por digest imutavel
        run: az deployment group create --name "apps-${GITHUB_RUN_ID}" --resource-group "$AZURE_RESOURCE_GROUP" --template-file infra/azure/apps.bicep --parameters "@$RUNNER_TEMP/bigpecas.parameters.json" --output none
      - name: Smoke tests HTTP sem alterar banco
        env:
          FRONTEND_URL: ${{ steps.platform.outputs.frontendUrl }}
          BACKEND_URL: ${{ steps.platform.outputs.backendUrl }}
        run: node scripts/devops/smoke.mjs
      - name: Registrar evidencia sem segredos
        if: success()
        env:
          FRONTEND_URL: ${{ steps.platform.outputs.frontendUrl }}
          BACKEND_URL: ${{ steps.platform.outputs.backendUrl }}
          BACKEND_DIGEST: ${{ steps.api.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.web.outputs.digest }}
        run: node scripts/devops/evidence.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: deployment-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bigpecas-evidence.json
          retention-days: 30
      - name: Limpar parametros sensiveis
        if: always()
        run: node -e "require('fs').rmSync(require('path').join(process.env.RUNNER_TEMP,'bigpecas.parameters.json'),{force:true})"
